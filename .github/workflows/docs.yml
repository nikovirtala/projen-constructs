# ~~ Generated by projen. To modify, edit .projenrc.ts and run "pnpm exec projen".

name: docs
on:
  release:
    types:
      - published
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 12.16.1
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: pnpm i --frozen-lockfile
      - name: Generate TypeDoc documentation
        id: generate_typedoc_documentation
        run: pnpm exec projen typedoc
      - name: Add custom domain
        id: add_custom_domain
        run: echo 'projen.nikovirtala.dev' > docs/api/CNAME
      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        id: upload_pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
concurrency:
  group: pages
  cancel-in-progress: false
